name: Deploy Thymer Docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/thymer/docs/**"
      - "apps/thymer/examples/full-config.toml"
      - "apps/thymer/package.json"
      - "apps/thymer/package-lock.json"
      - "apps/thymer/src/pkjs/**"
      - ".github/workflows/thymer-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/thymer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/thymer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Stage Pages artifact
        run: |
          mkdir -p /tmp/pages-site/thymer
          cp -R docs/.vitepress/dist/. /tmp/pages-site/thymer/
          cat > /tmp/pages-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Pebble App Docs</title>
              <meta http-equiv="refresh" content="0; url=/pebble-dev/thymer/guide/getting-started">
              <link rel="canonical" href="https://bnorick.github.io/pebble-dev/thymer/guide/getting-started">
            </head>
            <body>
              <p><a href="/pebble-dev/thymer/guide/getting-started">Open Thymer documentation</a></p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
