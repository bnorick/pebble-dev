[vibration]
pulse-delay = 200
superlow = 20
low = 100
mid = 300
high = 500

### EXERCISE ###
# timers for exercises I use regularly
[timers.eyesight]
trigger = { tap = "top" }
repeat = 3
pattern = [
  { name = "far",  time = "00:00:15", vibrate = "high" },
  { name = "near", time = "00:00:15", vibrate = "mid-mid" },
]
on-finished = { vibrate = "mid-low-mid" }

### KIDS ###
# some timers I use with my kids
[timers.sharing]
trigger = { tap = "left" }
repeat = true
must-acknowledge = true
on-press-up = "skip"
pattern = [
  { name = "Kid 1", time = "00:05:00", vibrate = "high" },
  { name = "Kid 2", time = "00:05:00", vibrate = "high" },
]

[timers.video-games]
trigger = { tap = "left" }
on-press-up = { action = "increment", time = "00:05:00" }
time = "00:15:00"
warn-at = [
  { time = "00:05:00", vibrate = "high" },
  { time = "00:01:00", vibrate = "high-high" },
]
on-finished = { vibrate="high-high-high" }

### BREATHING ###
# a couple breathing patterns I like
[timers.478]
name = "4-7-8"
trigger = { tap = "right" }
repeat = true
on-press-up = "hide"
pattern = [
  { name = "in",   time = "00:00:04", vibrate = "superlow" },
  { name = "hold", time = "00:00:07", vibrate = "superlow-superlow" },
  { name = "out",  time = "00:00:08", vibrate = "superlow-superlow-superlow" },
]

[timers.square]
trigger = { tap = "right" }
repeat = true
pattern = [
  { name = "in",   time = "00:00:04", vibrate = "superlow" },
  { name = "hold", time = "00:00:04", vibrate = "superlow" },
  { name = "out",  time = "00:00:04", vibrate = "superlow" },
  { name = "hold", time = "00:00:04", vibrate = "superlow" },
]

### SIMPLE TIMERS / STOPWATCH ###
# simple, likely useful timers for standard durations and a stopwatch
[timers.1-min]
trigger = { tap = "bottom" }
on-press-up = { action = "increment", time="00:01:00" }
on-long-press-up = { action = "increment", time="00:00:30" }
time = "00:01:00"
on-finished = { vibrate = "high-high" }

[timers.10-min]
trigger = { tap = "bottom" }
on-press-up = { action = "increment", time="00:05:00" }
on-long-press-up = { action = "increment", time="00:01:00" }
time = "00:10:00"
on-finished = { vibrate = "high-high" }

[timers.20-min]
trigger = { tap = "bottom" }
on-press-up = { action = "increment", time="00:10:00" }
on-long-press-up = { action = "increment", time="00:05:00" }
time = "00:20:00"
on-finished = { vibrate = "high-high" }

[timers.stopwatch]
trigger = { tap = "bottom" }
stopwatch = true

### TESTS ###
# change as I test various new config/functionality
[timers.test]
repeat = true
must-acknowledge = true
on-press-up = "skip"
pattern = [
  { name = "one",   time = "00:00:04", vibrate = "superlow" },
  { name = "two",   time = "00:00:04", vibrate = "superlow-superlow" },
  { name = "three", time = "00:00:08", vibrate = "superlow-superlow-superlow" },
]
trigger = { swipe = "up" }
