# Shared vibration presets.
[vibration]
pulse-delay = 200
acknowledgment-alert-duration = 12
warning = "low-low-low"
superlow = 60
low = 100
mid = 300
high = 500

# Named timers example. The section key becomes the default display name:
# breathing -> Breathing
[timers.breathing]
repeat = true
trigger = { tap = "top" }
on-press-up = "skip"
on-long-press-up = "hide"
must-acknowledge = true
acknowledgment-alert-duration = 5  # per-timer ack alert duration is valid too
repeat-pattern-delay = 500
vibrate = "superlow"
pattern = [
  { name = "inhale", hint = "through nose", time = 4, warn-at = "00:00:01" },
  { name = "hold", time = 4, warn-at = ["00:00:02", "00:00:01"] },
  { name = "exhale", hint = "slow release", time = "00:00:06.2500", vibrate = { duration = 140, delay = 80 } },
]

[timers.cool-down]
repeat = false
trigger = { tap = "bottom" }
vibrate = "superlow"
warn-at = { time = "00:00:02", vibrate = "low" }
pattern = [
  { name = "settle", time = 10 },
  { name = "breathe out", time = 8, vibrate = "low" },
]

# focus-block -> Focus Block
[timers.focus-block]
repeat = 4
trigger = { swipe = "l-to-r" }
# on-long-press-select defaults to "hide" when omitted.
on-finished = { vibrate = "low-low-high" }
vibrate = { intensity = "mid" }
pattern = [
  { name = "focus", hint = "deep work", time = "00:25:00", warn-at = { time = "00:05:00", vibrate = "low-low" } },
  { name = "short\nbreak", time = 5, vibrate = [
    { intensity = "superlow" },
    { duration = 200, delay = 120 },
    { intensity = "low", delay = 120 }
  ], warn-at = [
    { time = "00:00:03", vibrate = "superlow" },
    { time = "00:00:01", vibrate = { duration = 250, delay = 0 } }
  ] },
]

[timers.long-break]
name = "Long\nBreak"
repeat = false
trigger = { swipe = "c-to-b" }
stopwatch = true
on-press-up = { action = "decrement", time = "00:01:00" }
on-long-press-up = { action = "increment", time = "00:01:00" }
on-finished = { vibrate = [ { intensity = "low" }, { duration = 200 }, { intensity = "high" } ] }
hint = "walk away"
time = "00:15:00"
vibrate = { intensity = "high" }
warn-at = "00:01:00"

[timers.stopwatch]
trigger = { tap = "center" }
stopwatch = true
on-press-up = "hide"

[timers.focus-as-stopwatch]
trigger = { swipe = "down" }
time = "00:20:00"
on-long-press-select = "stopwatch"
