repos:
  - repo: local
    hooks:
      - id: thymer-full-config-sync
        name: Check Thymer full-config example sync
        entry: uv run apps/thymer/scripts/check_example_sync.py
        language: system
        files: ^apps/thymer/(examples/full-config\.toml|docs/cookbook/examples\.md)$
        pass_filenames: false
